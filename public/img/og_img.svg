<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <!-- Title gradient (HxH logo colors) -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#CC1100"/>
    </linearGradient>
    <!-- Top line gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CC1100" stop-opacity="0"/>
      <stop offset="50%" stop-color="#CC1100" stop-opacity="1"/>
      <stop offset="100%" stop-color="#CC1100" stop-opacity="0"/>
    </linearGradient>
    <!-- Side line gradient (decorative) -->
    <linearGradient id="sideLineL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="sideLineR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0"/>
    </linearGradient>
    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0D0D"/>
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Nen energy glow — left -->
  <ellipse cx="180" cy="315" rx="340" ry="280" fill="#CC1100" fill-opacity="0.09" filter="url(#glow)"/>
  <!-- Nen energy glow — right -->
  <ellipse cx="1020" cy="180" rx="260" ry="220" fill="#f59e0b" fill-opacity="0.055" filter="url(#glow)"/>
  <!-- Nen energy glow — bottom right -->
  <ellipse cx="950" cy="520" rx="220" ry="180" fill="#CC1100" fill-opacity="0.06" filter="url(#glow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#lineGrad)"/>

  <!-- Corner accent (clip-corner style) -->
  <polygon points="1200,0 1200,40 1160,0" fill="#CC1100" fill-opacity="0.5"/>

  <!-- ── MAIN TITLE ─────────────────────────────────── -->
  <text
    x="600" y="295"
    font-family="'Bebas Neue', 'Impact', 'Arial Black', sans-serif"
    font-size="118"
    font-weight="900"
    text-anchor="middle"
    letter-spacing="6"
    fill="url(#titleGrad)"
    filter="url(#glow)">
    HUNTER × HUNTER
  </text>

  <!-- ── DECORATIVE LINES around sub-label ─────────── -->
  <line x1="140" y1="338" x2="440" y2="338" stroke="url(#sideLineL)" stroke-width="1"/>
  <line x1="760" y1="338" x2="1060" y2="338" stroke="url(#sideLineR)" stroke-width="1"/>

  <!-- ── SUB LABEL ──────────────────────────────────── -->
  <text
    x="600" y="362"
    font-family="'Bebas Neue', 'Impact', 'Arial Black', sans-serif"
    font-size="32"
    text-anchor="middle"
    letter-spacing="16"
    fill="#FF7A00"
    fill-opacity="0.9">
    DATABASE API
  </text>

  <!-- ── DESCRIPTION ────────────────────────────────── -->
  <text
    x="600" y="420"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="18"
    text-anchor="middle"
    letter-spacing="1"
    fill="#555555">
    Free REST API · Characters · Groups · Nen Types · Abilities
  </text>

  <!-- ── BADGES ─────────────────────────────────────── -->
  <rect x="328" y="447" width="126" height="28" fill="rgba(200,30,30,0.12)" stroke="rgba(200,30,30,0.4)" stroke-width="1"/>
  <text x="391" y="466"
    font-family="'Bebas Neue', 'Impact', Arial, sans-serif"
    font-size="14" text-anchor="middle" letter-spacing="3" fill="#CC4444">
    FREE FOREVER
  </text>

  <rect x="468" y="447" width="114" height="28" fill="rgba(255,122,0,0.1)" stroke="rgba(255,122,0,0.3)" stroke-width="1"/>
  <text x="525" y="466"
    font-family="'Bebas Neue', 'Impact', Arial, sans-serif"
    font-size="14" text-anchor="middle" letter-spacing="3" fill="#FF7A00" fill-opacity="0.8">
    OPEN SOURCE
  </text>

  <rect x="596" y="447" width="100" height="28" fill="rgba(80,180,80,0.08)" stroke="rgba(80,180,80,0.25)" stroke-width="1"/>
  <text x="646" y="466"
    font-family="'Bebas Neue', 'Impact', Arial, sans-serif"
    font-size="14" text-anchor="middle" letter-spacing="3" fill="#4ade80" fill-opacity="0.7">
    NO COST
  </text>

  <!-- ── BOTTOM DIVIDER ─────────────────────────────── -->
  <rect x="400" y="510" width="400" height="1" fill="rgba(255,255,255,0.06)"/>

  <!-- ── URL ────────────────────────────────────────── -->
  <text
    x="600" y="552"
    font-family="'Bebas Neue', 'Impact', 'Arial Black', sans-serif"
    font-size="20"
    text-anchor="middle"
    letter-spacing="5"
    fill="#3A3A3A">
    HXH.EUGENEBADATO.COM
  </text>

  <!-- ── CREATOR ────────────────────────────────────── -->
  <text
    x="600" y="590"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    text-anchor="middle"
    letter-spacing="1"
    fill="#2A2A2A">
    Created by Eugene Paul Badato
  </text>
</svg>
